    <path d="M16 16L20.5 20.5" stroke="#00796b" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M17.5 17.5L20.5 20.5" stroke="#4db6ac" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Gradientes -->

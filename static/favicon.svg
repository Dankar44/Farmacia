    <!-- Cruz Médica -->
    <path d="M10.5 21V15H4C3.45 15 3 14.55 3 14V10C3 9.45 3.45 9 4 9H10.5V3C10.5 2.45 10.95 2 11.5 2H15.5C16.05 2 16.5 2.45 16.5 3V9H23C23.55 9 24 9.45 24 10V14C24 14.55 23.55 15 23 15H16.5V21C16.5 21.55 16.05 22 15.5 22H11.5C10.95 22 10.5 21.55 10.5 21Z" fill="url(#crossGrad)"/>
    
    <!-- Lupa Borde -->
    <circle cx="12" cy="12" r="5.5" fill="#ffffff" stroke="#00796b" stroke-width="2"/>
    
    <!-- Hoja Interior -->
    <path d="M14 8.5C14 8.5 15 9.5 15.5 10.5C16 11.5 14 13.5 11 14.5C11 14.5 9 10.5 14 8.5Z" fill="#00a99d"/>
    <path d="M11 14.5C11 14.5 12 12 14 10" stroke="#ffffff" stroke-width="1" stroke-linecap="round"/>
    
